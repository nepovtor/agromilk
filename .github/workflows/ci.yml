name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: landing_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d landing_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3100
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/landing_admin
      DATABASE_SSL: false
      COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: TestPassword123!
      ADMIN_NAME: CI Administrator
      ADMIN_FORCE_RESET: false
      UPLOAD_DIR: uploads
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm smoke-test
