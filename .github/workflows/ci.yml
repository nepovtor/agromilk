name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agromilk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agromilk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HOST: 127.0.0.1
      PORT: 3100
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agromilk
      DATABASE_SSL: false
      COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: TestPassword123!
      ADMIN_NAME: CI Administrator
      ADMIN_FORCE_RESET: false
      UPLOAD_DIR: uploads
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Reapply migrations
        run: pnpm db:migrate
      - name: Seed database
        run: pnpm seed
      - name: Run unit and integration coverage tests
        run: pnpm test:coverage
        env:
          NODE_ENV: test
      - name: Build production application
        run: pnpm build
        env:
          NODE_ENV: production
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e:ci
        env:
          NODE_ENV: test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --progress=plain -t agromilk-ci .
