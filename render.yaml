services:
  - type: web
    name: agromilk-platform
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: node dist/db/migrate.js
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agromilk-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: 14
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Администратор
      - key: ADMIN_FORCE_RESET
        value: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE
        value: 5242880
      - key: TRUST_PROXY
        value: false
      - key: BUSINESS_TIME_ZONE
        value: Europe/Minsk
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: agromilk-db
    plan: free
    region: frankfurt
    databaseName: agromilk
    user: agromilk
    postgresMajorVersion: "17"
